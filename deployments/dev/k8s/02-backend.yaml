apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dev
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-dev
  template:
    metadata:
      labels:
        app: backend-dev
    spec:
      containers:
      - name: backend
        image: 192.168.1.184:9443/3tier/backend:dev-latest
        env:
        - name: APP_ENV
          value: prod
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres-dev-service:5432/app_prod
        - name: SPRING_DATASOURCE_USERNAME
          value: prod_admin
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-dev-secret
              key: password
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-dev-service
  namespace: dev
spec:
  ports:
  - port: 8080
  selector:
    app: backend-dev
