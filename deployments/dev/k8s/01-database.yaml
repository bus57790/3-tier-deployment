apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-dev
  namespace: dev
spec:
  serviceName: postgres-dev
  replicas: 1
  selector:
    matchLabels:
      app: postgres-dev
  template:
    metadata:
      labels:
        app: postgres-dev
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: app_prod
        - name: POSTGRES_USER
          value: prod_admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-dev-secret
              key: password
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-dev-service
  namespace: dev
spec:
  ports:
  - port: 5432
  selector:
    app: postgres-dev
